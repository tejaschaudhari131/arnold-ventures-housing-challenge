# Optional reproduction of the locked Lab results. Does not write sample
# extracts. Confirm the committed fingerprints still match the source.
name: Lab results

on:
  workflow_dispatch:
    inputs:
      states:
        description: Comma-separated Lab states
        required: false
        default: "PA,NH"

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up
        run: bash scripts/setup.sh
      - name: Recompute and compare to the committed files
        env:
          PYTHONPATH: .
          LAB_STATES: ${{ inputs.states }}
        run: |
          .venv/bin/python -m src.lab.results --states "$LAB_STATES"
          .venv/bin/python -m pytest tests/test_lab_results.py tests/test_lab_rules.py -q
